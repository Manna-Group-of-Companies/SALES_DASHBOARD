# Build the managers' dashboard and deploy it to Cloudflare Pages.
#
# Cloudflare's own Git integration cannot be used for this repository: it is
# already connected to a Pages project on a different Cloudflare account, and
# Cloudflare allows a repository to feed only one account. This workflow
# replaces it with a Direct Upload, which has no such restriction and deploys
# the same thing — the built `client/dist` plus `client/functions`, the proxy
# that makes the ERPNext login work.
#
# Needs one secret, CLOUDFLARE_API_TOKEN, with Account → Cloudflare Pages →
# Edit on the Manna Group account. See client/DEPLOY.md. Without it the deploy
# step fails; nothing is half-published.

name: Dashboard → Cloudflare Pages

on:
  push:
    branches: [main]
    # Only when the dashboard changed. Flutter-only pushes would otherwise
    # rebuild and redeploy a byte-identical bundle. `shared/` is left out for
    # the reason given in client/DEPLOY.md: the build does not run the tests,
    # so a fixture change cannot alter what is served.
    paths:
      - 'client/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

# A slower run finishing after a newer one would put the older bundle live.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: manna-sales-dashboard
  # Not a secret: an account ID grants nothing without a token.
  CLOUDFLARE_ACCOUNT_ID: 900d34958d506287c81b92109e648c35

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # `tsc -b && vite build`. `.env.production` turns the mock data off, so
      # this must stay a production-mode build.
      - run: npm run build

      # First run only: Direct Upload projects must exist before a deploy.
      # Fails harmlessly with "already exists" on every run after that; a
      # genuine auth problem still surfaces in the deploy step below.
      - name: Create the Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. See client/DEPLOY.md."
            exit 1
          fi
          # --branch=main makes this the production deployment; anything else
          # would land as a preview on a hashed subdomain.
          npx wrangler pages deploy dist --project-name="$PROJECT" --branch=main \
            --commit-hash="${{ github.sha }}" --commit-message="$(git log -1 --pretty=%s)"
