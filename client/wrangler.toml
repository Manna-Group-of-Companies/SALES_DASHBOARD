# Cloudflare Pages config for the dashboard, read by `wrangler pages deploy`
# in .github/workflows/deploy-dashboard.yml.
#
# Because this file exists, it is the source of truth for the project's
# settings: variables set by hand in the Cloudflare dashboard are ignored on the
# next deploy. Change ERP_URL here, not there.

name = "manna-sales-dashboard"
pages_build_output_dir = "./dist"
compatibility_date = "2024-11-01"

[vars]
# Read by functions/_proxy.js at runtime, never baked into the bundle.
ERP_URL = "https://mannarubber.m.frappe.cloud"
